  - reference:
      reference: CapabilityStatement/us-core-client-liquid
    description: This Section describes the expected capabilities of the US Core Client
      which is responsible for creating and initiating the queries for information
      about an individual patient. The complete list of FHIR profiles, RESTful operations,
      and search parameters supported by US Core Servers are defined in the [Conformance
      Requirements for Server](CapabilityStatement-us-core-server.html). US Core Clients
      have the option of choosing from this list to access necessary data based on
      their local use cases and other contextual requirements.
    exampleBoolean: false
    name: US Core Client CapabilityStatement Liquid Rendered
  - reference:
      reference: StructureDefinition/us-core-diagnosticreport-lab
    description: The US Core DiagnosticReport Profile for Laboratory Results Reporting
      inherits from the FHIR [DiagnosticReport](https://hl7.org/fhir/R4/diagnosticreport.html)
      resource; refer to it for scope and usage definitions. Laboratory results are
      grouped and summarized using the DiagnosticReport resource, which typically
      references Observation resource(s). Each Observation resource represents an
      individual laboratory test and result value or component result values or a
      nested panel (such as a microbial susceptibility panel) that references other
      observations. Laboratory results can also be presented in report form or as
      free text. This profile sets minimum expectations for the DiagnosticReport resource
      to record, search,  and fetch laboratory results associated with a patient.
      It specifies which core elements, extensions, vocabularies, and value sets **SHALL**
      be present and constrains how the elements are used. Providing the floor for
      standards development for specific use cases promotes interoperability and adoption.
    exampleBoolean: false
    name: US Core DiagnosticReport Profile for Laboratory Results Reporting
  - reference:
      reference: StructureDefinition/us-core-patient
    description: The US Core Patient Profile inherits from the FHIR [Patient](https://hl7.org/fhir/R4/patient.html)
      resource; refer to it for scope and usage definitions. This profile meets the
      requirements of the [U.S. Core Data for Interoperability (USCDI)](https://www.healthit.gov/isp/united-states-core-data-interoperability-uscdi)
      *Patient Demographics/Information* Data Class. It sets minimum expectations
      for the Patient resource to record, search, and fetch basic demographics and
      other administrative information about an individual patient. It specifies which
      core elements, extensions, vocabularies, and value sets **SHALL** be present
      and constrains how the elements are used. Providing the floor for standards
      development for specific use cases promotes interoperability and adoption.
    exampleBoolean: false
    name: US Core Patient Profile
  - reference:
      reference: CapabilityStatement/us-core-server-liquid
    description: This Section describes the expected capabilities of the US Core Server
      actor which is responsible for providing responses to the queries submitted
      by the US Core Requestors. The complete list of FHIR profiles, RESTful operations,
      and search parameters supported by US Core Servers are defined. Systems implementing
      this capability statement should meet the ASTP 2015 Common Clinical Data Set
      (CCDS) access requirement for Patient Selection 170.315(g)(7) and Application
      Access - Data Category Request 170.315(g)(8) and the ASTP [U.S. Core Data for
      Interoperability (USCDI) Version 6 July 2025](https://www.healthit.gov/isp/sites/isp/files/2025-07/USCDI-Version-6-July-2025.pdf).
    exampleBoolean: false
    name: US Core Server CapabilityStatement Liquid Rendered
  - reference:
      reference: SearchParameter/us-core-diagnosticreport-category
    description: "**Which diagnostic discipline/department created the report**  \n\
      NOTE: This SearchParameter is defined only to document Server and Client expectations.\
      \ Its definition is derived from the standard FHIR SearchParameter and it uses\
      \ the [Conformance expectation extension](http://hl7.org/fhir/StructureDefinition/capabilitystatement-expectation)\
      \ to define additional expectations for the following SearchParameter elements:\n\
      - `multipleAnd`\n- `multipleOr`\n- `comparator`\n- `modifier`\n- `chain`\n\n\
      It **SHALL NOT** be used as a search parameter for search. Servers and Clients\
      \ **SHOULD** use the standard FHIR SearchParameter.\n"
    exampleBoolean: false
    name: USCoreDiagnosticreportCategory
